<!DOCTYPE html>
<html lang="en">
<head>
  <title>Search - Open Library</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/index.css">
  <script type="module" src="/src/components/index.js"></script>
  <script type="module">
    import catalogService from '/src/catalog-service.js';
    import prototypeSettings from '/src/prototype-settings-service.js';

    const state = { q: '', readable: false, subject: '', author: '', sort: 'Relevance', view: 'list' };
    let results = [];

    async function init() {
      await catalogService.ensureLoaded();
      const p = new URLSearchParams(location.search);
      state.q = p.get('q') ?? 'austen'; state.readable = p.get('readable') === '1'; state.subject = p.get('subject') || ''; state.author = p.get('author') || '';
      state.view = p.get('view') || localStorage.getItem('ol-view') || 'list';
      const input = document.getElementById('q'); input.value = state.q;
      let t; input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.q = input.value; sync(); }, 180); });
      document.getElementById('search-form').addEventListener('submit', e => { e.preventDefault(); state.q = input.value; sync(); });
      const tb = document.getElementById('toolbar'); tb.view = state.view;
      tb.addEventListener('ol-view-change', e => { state.view = e.detail.view; render(); });
      tb.addEventListener('ol-sort-change', e => { state.sort = e.detail.sort; sync(); });
      document.getElementById('facets').addEventListener('click', e => {
        const a = e.target.closest('a[data-facet]'); if (!a) return; e.preventDefault();
        const [k, v] = [a.dataset.facet, a.dataset.value];
        if (k === 'readable') state.readable = v === '1'; else state[k] = (state[k] === v ? '' : v);
        sync();
      });
      const peek = document.querySelector('ol-peek-panel');
      peek.addEventListener('ol-peek-change', e => { document.getElementById('results').activeKey = e.detail.key || ''; });
      const note = document.getElementById('today-note');
      const syncNote = () => { note.hidden = !(prototypeSettings.get().row === 'today' && state.view === 'grid'); };
      document.addEventListener('ol-settings-change', syncNote);
      sync();
    }
    function sync() {
      results = catalogService.search(state.q, { readableOnly: state.readable, subjects: state.subject ? [state.subject] : [], authors: state.author ? [state.author] : [] });
      if (state.sort === 'Most editions') results = [...results].sort((a, b) => b.editions - a.editions);
      else if (state.sort === 'First published') results = [...results].sort((a, b) => a.year - b.year);
      else if (state.sort === 'Rating') results = [...results].sort((a, b) => b.rating - a.rating);
      const p = new URLSearchParams(); if (state.q) p.set('q', state.q); if (state.readable) p.set('readable', '1'); if (state.subject) p.set('subject', state.subject); if (state.author) p.set('author', state.author);
      history.replaceState(null, '', location.pathname + '?' + p);
      renderFacets(); render();
    }
    function renderFacets() {
      const all = catalogService.search(state.q, {});
      const count = (fn) => all.filter(fn).length;
      const subj = new Map(), auth = new Map();
      for (const b of all) { for (const s of b.subjects || []) subj.set(s, (subj.get(s) || 0) + 1); auth.set(b.author, (auth.get(b.author) || 0) + 1); }
      const top = (m, n) => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
      const li = (k, v, label, n, cur) => `<li><a href="#" data-facet="${k}" data-value="${v}" aria-current="${cur}">${label}</a><span>${n}</span></li>`;
      document.getElementById('facets').innerHTML = `
        <h4>Ebook</h4><ul>${li('readable', '0', 'Any', all.length, !state.readable)}${li('readable', '1', 'Readable now', count(b => catalogService.access(b).readable), state.readable)}</ul>
        <h4>Subject</h4><ul>${top(subj, 8).map(([s, n]) => li('subject', s, s, n, state.subject === s)).join('')}</ul>
        <h4>Author</h4><ul>${top(auth, 6).map(([a, n]) => li('author', a, a, n, state.author === a)).join('')}</ul>`;
    }
    function render() {
      const col = document.getElementById('results');
      col.keys = results.map(b => b.key); col.view = state.view; col.intent = 'discover';
      col.emptyText = state.q ? `No results for “${state.q}”` : 'Enter a search term above';
      document.getElementById('toolbar').count = `${results.length.toLocaleString()} result${results.length === 1 ? '' : 's'}${state.q ? ` for “${state.q}”` : ''}`;
      const peek = document.querySelector('ol-peek-panel'); peek.keys = col.keys; peek.intent = 'discover';
      document.getElementById('today-note').hidden = !(prototypeSettings.get().row === 'today' && state.view === 'grid');
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  </script>
</head>
<body>
  <ol-main-nav hide-search></ol-main-nav>
  <main>
    <div class="page-cols">
      <aside class="facets" id="facets"></aside>
      <div>
        <form id="search-form" class="search" style="display:flex;gap:var(--spacing-2);margin-bottom:var(--spacing-4);max-width:640px">
          <input type="search" id="q" placeholder="Search for a book, author or subject…" aria-label="Search">
          <ol-button type="submit">Search</ol-button>
        </form>
        <ol-results-toolbar id="toolbar"></ol-results-toolbar>
        <p class="today-note" id="today-note" hidden>Today: grid is the same row markup with details, rating and check-in hidden by CSS.</p>
        <ol-book-collection id="results" view="list" intent="discover"></ol-book-collection>
      </div>
    </div>
  </main>
  <ol-peek-panel intent="discover"></ol-peek-panel>
  <ol-prototype-controls></ol-prototype-controls>
</body>
</html>
